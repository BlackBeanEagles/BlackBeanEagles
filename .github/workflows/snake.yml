# Generates a snake animation from the GitHub contribution graph and commits SVG assets.
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-content
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: BlackBeanEagles
          outputs: |
            assets/github-snake.svg?color_snake=FF006E&color_dots=FFBE0B,8338EC,00F5FF,39FF14
            assets/github-snake-dark.svg?palette=github-dark&color_snake=FF006E&color_dots=FFBE0B,8338EC,00F5FF,39FF14

      - name: Commit and push snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update contribution snake animation"
          git pull --rebase origin main
          git push
