# Generates Nokia-style snake GIF and GitHub contribution snake assets.
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-content
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Nokia snake GIF
        run: |
          pip install pillow
          python scripts/generate_nokia_snake_gif.py

      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: BlackBeanEagles
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit and push snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update snake animations"
          git pull --rebase origin main
          git push
