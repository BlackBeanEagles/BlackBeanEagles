# Updates live dashboard sections in README.md (activity, quotes, recent repos).
name: Update Live Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-readme-content
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build live dashboard data
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          export NOW_BUILDING=$(gh api "users/${USERNAME}/repos?sort=pushed&direction=desc&per_page=5" \
            --jq '[.[] | select(.name != "BlackBeanEagles")][0] | "\(.name)|\(.html_url)|\(.language // "Multi")|\(.pushed_at | split("T")[0])"')

          export RECENT_REPOS=$(gh api "users/${USERNAME}/repos?sort=pushed&direction=desc&per_page=10" \
            --jq '[.[] | select(.name != "BlackBeanEagles") | "- [\(.name)](\(.html_url)) — \(.language // "Multi") · \(.pushed_at | split("T")[0])"] | .[0:6] | join("\n")')

          export LAST_EVENT=$(gh api "users/${USERNAME}/events/public?per_page=1" \
            --jq '.[0] | if .type == "PushEvent" then "push → \(.repo.name | split("/")[1]) (\(.payload.commits | length) commits)" elif .type == "CreateEvent" then "created → \(.repo.name | split("/")[1])" elif .type == "PullRequestEvent" then "PR → \(.repo.name | split("/")[1])" else "\(.type | gsub("Event"; "")) → \(.repo.name | split("/")[1])" end')

          export TOTAL_REPOS=$(gh api "users/${USERNAME}" --jq .public_repos)
          export FOLLOWERS=$(gh api "users/${USERNAME}" --jq .followers)

          DAY=$(date -u +%j)
          QUOTES=(
            "The best error message is the one that never appears."
            "Security is not a product — it is a process."
            "First solve the problem. Then write the code."
            "Good commits tell a story. Great commits tell the truth."
            "AI amplifies intent. Clear intent amplifies impact."
            "Ship small. Ship often. Ship securely."
            "Make it work, make it right, make it fast — in that order."
          )
          export DEV_QUOTE="${QUOTES[$((DAY % ${#QUOTES[@]}))]}"

          python3 << 'PYEOF'
          import os
          import re

          now = os.environ["NOW_BUILDING"].split("|")
          name, url, lang, date = now[0], now[1], now[2], now[3]

          sections = {
              "NOW_BUILDING": f"""<!-- NOW_BUILDING:START -->
> **Now building:** [`{name}`]({url}) · `{lang}` · last push `{date}`

```bash
$ git clone {url}.git && cd {name} && echo "Let's build."
```
<!-- NOW_BUILDING:END -->""",
              "LIVE_FEED": f"""<!-- LIVE_FEED:START -->
| Signal | Value |
| :--- | :--- |
| **Last public activity** | `{os.environ["LAST_EVENT"]}` |
| **Public repos** | `{os.environ["TOTAL_REPOS"]}` |
| **Followers** | `{os.environ["FOLLOWERS"]}` |
| **Profile sync** | auto-updated every 6 hours |
<!-- LIVE_FEED:END -->""",
              "RECENT_REPOS": f"""<!-- RECENT_REPOS:START -->
{os.environ["RECENT_REPOS"]}
<!-- RECENT_REPOS:END -->""",
              "DEV_QUOTE": f"""<!-- DEV_QUOTE:START -->
> *"{os.environ["DEV_QUOTE"]}"*
<!-- DEV_QUOTE:END -->""",
          }

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          for marker, replacement in sections.items():
              pattern = re.compile(
                  rf"<!-- {marker}:START -->.*?<!-- {marker}:END -->",
                  re.DOTALL,
              )
              content = pattern.sub(replacement, content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh live dashboard"
          git pull --rebase origin main
          git push
