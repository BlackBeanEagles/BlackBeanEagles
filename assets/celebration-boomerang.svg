<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100" role="img" aria-label="Boomerang celebration loop">
  <defs>
    <linearGradient id="boomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <g transform="translate(400 45)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#boomGrad)" stroke-width="3" opacity="0.5">
      <animate attributeName="r" values="28;42;28" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="22" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>
    <text text-anchor="middle" y="8" fill="#06B6D4" font-family="ui-monospace, monospace" font-size="18" font-weight="700">YAY</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.14;1;0.92;1" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(140 45)">
    <circle cx="0" cy="0" r="18" fill="#7C3AED"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0; 0,8; 0,0" dur="1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="1.8s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(260 45)">
    <circle cx="0" cy="0" r="18" fill="#06B6D4"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0; 0,-10; 0,0" dur="2.1s" begin="0.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;0.88;1;1.12;1" dur="2.1s" begin="0.2s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(540 45)">
    <circle cx="0" cy="0" r="18" fill="#EC4899"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0; 0,10; 0,0" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.15;1;0.9;1" dur="1.9s" begin="0.4s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(660 45)">
    <circle cx="0" cy="0" r="18" fill="#F59E0B"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0; 0,-8; 0,0" dur="2.0s" begin="0.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;0.9;1;1.1;1" dur="2.0s" begin="0.6s" repeatCount="indefinite" additive="sum"/>
  </g>
  <text x="400" y="88" text-anchor="middle" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="12">boomerang loop keeps celebrating</text>
</svg>
