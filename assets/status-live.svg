<svg xmlns="http://www.w3.org/2000/svg" width="420" height="44" viewBox="0 0 420 44" role="img" aria-label="Live status indicator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="418" height="42" rx="10" fill="url(#bg)" stroke="#30363D" stroke-width="1"/>
  <circle cx="22" cy="22" r="7" fill="#22C55E" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;9;7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="22" r="12" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.35">
    <animate attributeName="r" values="10;16;10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="18" fill="#06B6D4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">STATUS</text>
  <text x="42" y="32" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ONLINE · shipping code · open to collab</text>
  <text x="350" y="27" fill="#7C3AED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">UTC+5:30</text>
</svg>
