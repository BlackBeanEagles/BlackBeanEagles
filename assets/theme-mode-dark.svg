<svg xmlns="http://www.w3.org/2000/svg" width="360" height="36" viewBox="0 0 360 36" role="img" aria-label="Dark mode active">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <rect width="360" height="36" rx="18" fill="url(#darkBg)" stroke="#30363D"/>
  <text x="18" y="23" fill="#06B6D4" font-family="ui-monospace, monospace" font-size="13"><</text>
  <text x="42" y="23" fill="#E6EDF3" font-family="ui-monospace, monospace" font-size="12" font-weight="700">DARK MODE</text>
  <text x="138" y="23" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="11">profile adapts to your system theme</text>
  <circle cx="330" cy="18" r="5" fill="#7C3AED">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
