<svg xmlns="http://www.w3.org/2000/svg" width="360" height="36" viewBox="0 0 360 36" role="img" aria-label="Light mode active">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="360" height="36" rx="18" fill="url(#lightBg)" stroke="#CBD5E1"/>
  <circle cx="24" cy="18" r="7" fill="#F59E0B"/>
  <text x="42" y="23" fill="#0F172A" font-family="ui-monospace, monospace" font-size="12" font-weight="700">LIGHT MODE</text>
  <text x="148" y="23" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">profile adapts to your system theme</text>
  <circle cx="330" cy="18" r="5" fill="#06B6D4">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
