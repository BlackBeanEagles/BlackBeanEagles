<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-label="Welcome celebration with confetti">
  <defs>
    <linearGradient id="welcomeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="50%" stop-color="#161B22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="140" fill="url(#welcomeBg)" rx="16"/>

  <g id="confetti">
    <rect x="40" y="20" width="8" height="14" fill="#06B6D4" rx="2" transform="rotate(20 44 27)">
      <animate attributeName="y" values="10;120;10" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="8" width="6" height="12" fill="#7C3AED" rx="2" transform="rotate(-15 123 14)">
      <animate attributeName="y" values="0;115;0" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="120;130;120" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="30" r="5" fill="#EC4899">
      <animate attributeName="cy" values="15;125;15" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="280" y="12" width="7" height="13" fill="#F59E0B" rx="2" transform="rotate(35 283 18)">
      <animate attributeName="y" values="5;118;5" dur="3.5s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="360" cy="22" r="4" fill="#22C55E">
      <animate attributeName="cy" values="8;122;8" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="360;350;360" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="440" y="18" width="9" height="11" fill="#06B6D4" rx="2" transform="rotate(-25 444 23)">
      <animate attributeName="y" values="12;120;12" dur="3.1s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="520" cy="28" r="5" fill="#E879F9">
      <animate attributeName="cy" values="10;125;10" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="600" y="10" width="8" height="14" fill="#7C3AED" rx="2" transform="rotate(15 604 17)">
      <animate attributeName="y" values="0;116;0" dur="3.3s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <circle cx="680" cy="20" r="4" fill="#F59E0B">
      <animate attributeName="cy" values="6;124;6" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <rect x="740" y="16" width="7" height="12" fill="#EC4899" rx="2" transform="rotate(-30 743 22)">
      <animate attributeName="y" values="8;119;8" dur="3.0s" begin="0.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="25" width="6" height="10" fill="#22C55E" rx="1" transform="rotate(45 93 30)">
      <animate attributeName="y" values="18;118;18" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="320" cy="18" r="3" fill="#06B6D4">
      <animate attributeName="cy" values="5;115;5" dur="2.3s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <rect x="480" y="22" width="8" height="12" fill="#E879F9" rx="2" transform="rotate(10 484 28)">
      <animate attributeName="y" values="14;121;14" dur="3.6s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <circle cx="640" cy="26" r="5" fill="#7C3AED">
      <animate attributeName="cy" values="12;123;12" dur="2.85s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(400 72)">
    <text text-anchor="middle" y="0" fill="url(#textGrad)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700">
      Thanks for visiting!
    </text>
    <text text-anchor="middle" y="28" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      confetti mode: ON
    </text>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.06;1;0.97;1" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <g fill="#F59E0B">
    <polygon points="760,40 764,50 774,50 766,57 769,67 760,61 751,67 754,57 746,50 756,50">
      <animateTransform attributeName="transform" type="rotate" from="0 760 54" to="360 760 54" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="50,50 53,57 60,57 55,62 57,69 50,65 43,69 45,62 40,57 47,57">
      <animateTransform attributeName="transform" type="rotate" from="360 50 60" to="0 50 60" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
